<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil LinkedIn · Henry Martínez</title>
  <meta name="description" content="Guía de copiar y pegar para actualizar el perfil de LinkedIn de Henry Martínez Sarmiento, Director de la UIFCE - Universidad Nacional de Colombia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <img class="topbar__logo" src="assets/logo-uifce-et.webp" alt="UIFCE Estrategias Tecnológicas" width="720" height="114">
      <div class="seg" id="langSwitch" role="group" aria-label="Idioma de los textos">
        <button type="button" class="seg__btn" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" class="seg__btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
      <span class="progress__text" id="progressText"></span>
    </div>
  </header>

  <main class="panel">
    <section class="intro">
      <img class="intro__mascot" src="assets/uifcito.webp" alt="" width="501" height="640">
      <div>
        <h1 id="title">Tu perfil de LinkedIn, listo para copiar y pegar</h1>
        <p id="intro"></p>
        <a class="btn btn--ghost" id="openProfile" href="#" target="_blank" rel="noopener">Abrir mi perfil de LinkedIn ↗</a>
        <p class="note" id="enNote" hidden></p>
      </div>
    </section>

    <ol class="steps" id="steps"></ol>
  </main>

  <footer class="footer">
    <img src="assets/logo-uifce-blanco.png" alt="UIFCE" width="900" height="397">
    <p id="footerText"></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
